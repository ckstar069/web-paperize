<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>web-paperize</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 data-i18n="popup.title">Export PDF</h1>
  </header>
  <main>
    <label class="row"><span data-i18n="popup.paper">Paper</span>
      <select id="paper">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
      </select>
    </label>
    <label class="row"><span data-i18n="popup.layout">Layout</span>
      <select id="layoutMode">
        <option value="auto" data-i18n="option.auto">Auto</option>
        <option value="paperized" data-i18n="option.paperized">Paperized</option>
        <option value="original" data-i18n="option.original">Original</option>
      </select>
    </label>
    <div class="hint" id="layoutHint">Auto: uses Paperized for reliable reading content; otherwise preserves the page.</div>
    <label class="row"><span data-i18n="popup.orientation">Orientation</span>
      <select id="orientation">
        <option value="auto" data-i18n="option.auto">Auto</option>
        <option value="portrait" data-i18n="option.portrait">Portrait</option>
        <option value="landscape" data-i18n="option.landscape">Landscape</option>
      </select>
    </label>
    <label class="row"><span data-i18n="popup.margin">Margin</span>
      <select id="margin">
        <option value="none" data-i18n="option.none">None</option>
        <option value="slim" data-i18n="option.slim">Slim</option>
        <option value="normal" data-i18n="option.normal">Normal</option>
        <option value="wide" data-i18n="option.wide">Wide</option>
      </select>
    </label>
    <label class="row"><span data-i18n="popup.language">Language</span>
      <select id="uiLanguage">
        <option value="auto" data-i18n="option.languageAuto">Auto</option>
        <option value="zh-CN" data-i18n="option.languageZhCN">简体中文</option>
        <option value="en" data-i18n="option.languageEn">English</option>
      </select>
    </label>

    <label class="row check">
      <input type="checkbox" id="singlePage">
      <span data-i18n="popup.singlePage">One continuous page</span>
    </label>

    <div class="progress" id="progress" hidden>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="text" id="progressText"></div>
    </div>
    <div class="status" id="status" hidden></div>

    <button id="save" class="primary" data-i18n="popup.save">Save as PDF</button>
    <button id="pick" class="secondary" data-i18n="popup.pick">Pick an element…</button>
  </main>
  <footer data-i18n="popup.footer">No web-paperize server, no telemetry. Nothing is sent to unrelated third parties.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
